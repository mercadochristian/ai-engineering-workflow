name: Publish workflow deck

on:
  push:
    branches:
      - main
    paths:
      - docs/workflow-deck/**
      - .github/workflows/workflow-deck-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-deck-pages
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Package the deck
        run: |
          mkdir -p _site/workflow-deck
          install -m 644 docs/workflow-deck/index.html docs/workflow-deck/deckframe.css docs/workflow-deck/deckframe.js _site/workflow-deck/
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy deck to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
