<svg xmlns="http://www.w3.org/2000/svg" width="960" height="224" viewBox="0 0 960 224" role="img" aria-labelledby="title desc">
  <title id="title">From a question to evidence</title>
  <desc id="desc">Define the outcome, inspect the source, make a bounded change, verify behavior, and hand off the evidence. A small marker travels through the five stages twice, then rests. Reduced motion shows the static diagram.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .label { fill: #f1f5f9; font-size: 18px; font-weight: 600; }
    .detail { fill: #a9bbce; font-size: 12px; }
    .traveler { animation: travel 10s ease-in-out 2 forwards; }
    @keyframes travel {
      0%, 8% { transform: translateX(0); }
      23%, 31% { transform: translateX(183px); }
      46%, 54% { transform: translateX(366px); }
      69%, 77% { transform: translateX(549px); }
      92%, 100% { transform: translateX(732px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .traveler { animation: none; transform: translateX(732px); }
    }
  </style>
  <rect width="960" height="224" rx="18" fill="#101c2d"/>
  <circle cx="28" cy="27" r="4" fill="#fb7185"/>
  <circle cx="44" cy="27" r="4" fill="#fbbf24"/>
  <circle cx="60" cy="27" r="4" fill="#5eead4"/>
  <text x="82" y="32" class="detail">workflow / one useful step at a time</text>
  <text x="40" y="83" class="detail">01</text>
  <text x="40" y="109" class="label">Define</text>
  <text x="40" y="132" class="detail">Name the outcome</text>
  <text x="223" y="83" class="detail">02</text>
  <text x="223" y="109" class="label">Inspect</text>
  <text x="223" y="132" class="detail">Find the owner</text>
  <text x="406" y="83" class="detail">03</text>
  <text x="406" y="109" class="label">Change</text>
  <text x="406" y="132" class="detail">Keep it bounded</text>
  <text x="589" y="83" class="detail">04</text>
  <text x="589" y="109" class="label">Verify</text>
  <text x="589" y="132" class="detail">Follow the caller</text>
  <text x="772" y="83" class="detail">05</text>
  <text x="772" y="109" class="label">Hand off</text>
  <text x="772" y="132" class="detail">Show the evidence</text>
  <path d="M48 165H780" stroke="#34485f" stroke-width="2"/>
  <g fill="#a9bbce">
    <circle cx="48" cy="165" r="3"/>
    <circle cx="231" cy="165" r="3"/>
    <circle cx="414" cy="165" r="3"/>
    <circle cx="597" cy="165" r="3"/>
    <circle cx="780" cy="165" r="3"/>
  </g>
  <circle class="traveler" cx="48" cy="165" r="7" fill="#5eead4" stroke="#101c2d" stroke-width="3"/>
  <text x="40" y="202" class="detail">Contradiction? Return to the source. Keep the uncertainty visible.</text>
</svg>
